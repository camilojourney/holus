# Brand Visual Identity
# Multi-tenant config: replace this file with your own brand to customize the entire pipeline.
# All rendering templates consume these values via CSS custom properties.

colors:
  primary: "#6366F1"       # Indigo-500 — AI/tech, hook slide background + CTAs
  text: "#F8FAFC"          # Slate-50 — near white, main text on dark backgrounds
  background: "#0A0F1E"    # Deep navy — premium dark base
  surface: "#0F172A"       # Slate-900 — body slide surface
  accent: "#A5B4FC"        # Indigo-300 — lighter accent for highlights and bullets
  muted: "#64748B"         # Slate-500 — labels, counters, secondary text
  success: "#34D399"       # Emerald-400
  danger: "#F87171"        # Red-400

typography:
  primary_font: "Plus Jakarta Sans"
  secondary_font: "JetBrains Mono"
  weights:
    headline: 800
    body: 400
    caption: 500
  sizes:
    headline: 72
    subheadline: 40
    body: 20
    caption: 13
    min_slide_headline: 64
    min_slide_body: 28

spacing:
  base_unit: 4
  margin: 64
  padding: 40
  gap: 24

layout:
  slide_width: 1080
  slide_height: 1350
  slide_aspect: "4:5"
  image_width: 1080
  image_height: 1080
  border_radius: 16

safe_zones:
  slide_top: 48
  slide_bottom: 120
  slide_left: 96
  slide_right: 96
  page_counter_top: 100
  page_counter_right: 150

rules:
  max_fonts_per_slide: 2
  max_colors_per_slide: 3
  min_contrast_ratio: 4.5

themes:
  dark:
    colors:
      primary: "#6366F1"
      text: "#F8FAFC"
      background: "#0A0F1E"
      surface: "#0F172A"
      accent: "#A5B4FC"
      muted: "#64748B"
      success: "#34D399"
      danger: "#F87171"

  light:
    colors:
      primary: "#4F46E5"
      text: "#1E293B"
      background: "#FAFAFA"
      surface: "#FFFFFF"
      accent: "#818CF8"
      muted: "#94A3B8"
      success: "#059669"
      danger: "#DC2626"

  warm:
    colors:
      primary: "#F59E0B"
      text: "#FEF3C7"
      background: "#1C1310"
      surface: "#2C1F1A"
      accent: "#FCD34D"
      muted: "#92400E"
      success: "#34D399"
      danger: "#F87171"

  cool:
    colors:
      primary: "#06B6D4"
      text: "#E0F2FE"
      background: "#0C1222"
      surface: "#111827"
      accent: "#67E8F9"
      muted: "#64748B"
      success: "#34D399"
      danger: "#F87171"

  bold:
    colors:
      primary: "#EF4444"
      text: "#FAFAFA"
      background: "#18181B"
      surface: "#27272A"
      accent: "#FCA5A5"
      muted: "#71717A"
      success: "#34D399"
      danger: "#F87171"
