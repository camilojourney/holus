# Brand Visual Identity
# Multi-tenant config: replace this file with your own brand to customize the entire pipeline.
# All rendering templates consume these values via CSS custom properties.

colors:
  primary: "#E85D04"       # Primary brand color
  text: "#1A1A2E"          # Primary text color
  background: "#FFFFFF"    # Background color
  surface: "#F8F9FA"       # Surface/card color
  accent: "#2563EB"        # Accent color for highlights
  muted: "#6B7280"         # Muted/secondary text
  success: "#059669"       # Success/positive color
  danger: "#DC2626"        # Danger/warning color

typography:
  primary_font: "Inter"
  secondary_font: "JetBrains Mono"
  weights:
    headline: 700
    body: 400
    caption: 300
  sizes:
    headline: 48
    subheadline: 32
    body: 18
    caption: 14
    min_slide_headline: 48
    min_slide_body: 24

spacing:
  base_unit: 4
  margin: 64
  padding: 32
  gap: 16

layout:
  slide_width: 1080
  slide_height: 1350
  slide_aspect: "4:5"
  image_width: 1080
  image_height: 1080
  border_radius: 12

safe_zones:
  slide_top: 40
  slide_bottom: 120
  slide_left: 100
  slide_right: 100
  page_counter_top: 100
  page_counter_right: 150

rules:
  max_fonts_per_slide: 2
  max_colors_per_slide: 3
  min_contrast_ratio: 4.5
