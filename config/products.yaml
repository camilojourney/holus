# Holus — Products Being Promoted
# This is the source of truth for what Holus markets.
# Update when products launch new features or audience changes.
# Last updated: 2026-02-25

products:
  pilaster:
    name: "Pilaster"
    tagline: "AI image generation platform with memory"
    description: >
      Pilaster is an AI image generation platform that remembers what works.
      It owns three layers: (1) Character registry — LoRAs, reference sheets,
      and metadata for consistent characters across all generations.
      (2) Generation abstraction — a backend-agnostic interface that delegates
      to ComfyUI, Replicate, Runway, or any future engine. Users never see
      nodes — they pick a character, a template, and hit generate.
      (3) Experiment memory — tracks every generation with outcomes and
      quality scores, learns what prompts/settings work, warns before
      repeating failures. Backends are swappable. The memory and characters
      are the product.
    url: "https://pilaster.ai"
    status: "mvp_active"
    audience: "AI artists, content creators, image generation users"
    pain_point: "Can't keep characters consistent. Can't reproduce my best results. Locked into one tool."
    capabilities:
      - character_registry  # Store LoRAs, reference sheets, manage visual identity
      - generation          # Backend-agnostic image generation (ComfyUI, Replicate, etc.)
      - templates           # Reusable generation templates ("product shot", "anime scene")
      - experiment_memory   # Track what worked, what failed, quality scores
      - short_video         # AnimateDiff/SVD short clips via ComfyUI backend
    platforms:
      - linkedin
      - tiktok
      - youtube_shorts
    content_types:
      - tutorial          # "How to keep your AI characters consistent"
      - before_after      # "Same character, 10 scenes — always consistent"
      - tips              # "Why LoRAs are the secret to brand consistency"
      - demo              # Live generation with character + template
      - character_showcase # "Meet our mascot — made with Pilaster"

  genpeli:
    name: "Genpeli"
    tagline: "AI video editing pipeline"
    description: >
      Genpeli takes your raw video, removes silences and fillers,
      burns captions, normalizes audio, and pushes to social.
      For content creators who want polished shorts without manual editing.
    url: ""
    status: "internal_pipeline"
    audience: "Content creators, YouTubers, short-form video creators"
    pain_point: "Video editing takes hours. I just want to press record and have it ready."
    platforms:
      - linkedin
      - instagram
    content_types:
      - demo              # Before/after of raw vs processed video
      - case_study        # "How I edited 10 videos in 1 hour"
      - tutorial          # "Setting up your AI video pipeline"

  invoz:
    name: "Invoz"
    tagline: "Audio ML API"
    description: >
      Invoz is a Whisper-powered audio processing API.
      Transcription, speaker diarization, silence detection.
      For developers building audio-first applications.
    url: ""
    status: "in_development"
    audience: "Developers, technical founders"
    pain_point: "Whisper setup is painful. I just need a clean API."
    platforms:
      - linkedin
      - twitter
    content_types:
      - technical_post    # API usage examples
      - demo              # Transcription accuracy comparison

