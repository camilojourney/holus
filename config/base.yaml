# Holus — Base Configuration
# Overridden by config/{agent}.yaml, then by environment variables.
# Secrets NEVER go here — use .env.

coordinator:
  model: claude-opus-4-6
  synthesis_schedule: "0 7 * * *"  # 07:00 daily
  max_tokens: 8192


event_bus:
  redis_url: ${REDIS_URL}
  stream_max_len: 10000

database:
  url: ${DATABASE_URL}
  pool_size: 10

observability:
  langfuse_enabled: true
  log_level: INFO

# Holus owns lineage as a local, append-only artifact; consumers are read-only.
lineage:
  schema_version: "1.0"
  retention_days: 365
lineage_dir: data/lineage
