# Cold Start Content Calendar
# Systematic coverage of all 20 combinations (5 pillars x 4 platforms)
# in 4 days to seed data collection for the self-improvement loop.
#
# Run this ONCE when the system first activates to ensure every
# (pillar, platform) combination has at least 1 data point.
# After day 4, Thompson Sampling takes over strategy decisions.

# Day 1: LinkedIn (primary platform, highest ROI)
day_1:
  - pillar: ai_engineering
    platform: linkedin
    format: carousel_outline
    idea_seed: "How I built a self-improving AI agent — the 5 mechanisms"
  - pillar: building_in_public
    platform: linkedin
    format: text_post
    idea_seed: "What I learned shipping 10 repos in 3 months"
  - pillar: systems_thinking
    platform: linkedin
    format: carousel_outline
    idea_seed: "Why most AI agents fail after week 1 — the missing feedback loop"
  - pillar: bilingual_ai
    platform: linkedin
    format: text_post
    idea_seed: "The 600M Spanish-English market Silicon Valley ignores"
  - pillar: contrarian_takes
    platform: linkedin
    format: text_post
    idea_seed: "Stop fine-tuning. Start prompt-evolving."

