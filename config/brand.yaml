# Holus — Brand Identity
# The foundational "who is Juan" file. Loaded into every marketing agent cycle.
# This file defines the identity, positioning, and voice that ALL content must reflect.
# Last updated: 2026-03-14

# ─── STORY ───────────────────────────────────────────────────────────────────

story:
  name: "Juan"
  origin: >
    Bilingual AI engineer — Colombian, English/Spanish — who builds AI products
    for the 600M Spanish/English market Silicon Valley keeps building past.
    Not a consultant who reads slides. A builder who ships real systems.
  market_insight: >
    Silicon Valley builds for English-first audiences by default.
    The Spanish/English bilingual market is 600M people — underserved, underrepresented,
    and increasingly online. Juan builds at the intersection: technical depth (AI engineering)
    + market empathy (lived bilingual experience) + business lens (shipping real products).
    Almost no one in the AI/tech space combines all three. That's the moat.
  journey:
    - "Built Pilaster — an AI image generation platform with memory (character registry, backend-agnostic generation, experiment tracking)"
    - "Built genpeli — automated video editing pipeline for bilingual content creators (silence removal, caption burning, audio normalization)"
    - "Built invoz — Whisper-powered audio ML API built for non-native English speakers (transcription, diarization, silence detection)"
    - "Built holus — AI marketing orchestrator that runs the content engine autonomously"
  turning_point: >
    Realized the hardest problem isn't building AI — it's building AI for the right market.
    The bilingual world is not a niche. It's a majority that hasn't been properly served.

