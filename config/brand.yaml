# ─── PRODUCTS AS PROOF ───────────────────────────────────────────────────────

products_as_proof:
  framing: >
    Products are evidence of builder expertise. Every product story is a
    consulting proof point: "I did this myself. I can help you do it too."

  pilaster:
    proof_narrative: "I built an AI image platform with memory. Here's what I learned about production AI systems."
    consulting_angle: "Character consistency, experiment tracking, backend abstraction — the patterns transfer to any AI deployment."
    key_stories:
      - "How I made AI image generation backend-agnostic (and why your AI stack should be too)"
      - "The experiment memory pattern — why every AI system needs to remember what works"
      - "From ComfyUI nodes to production API — the abstraction that changed everything"

  genpeli:
    proof_narrative: "I automated my video editing pipeline. Here's the architecture."
    consulting_angle: "Workflow automation, Whisper integration, processing pipelines — real production AI, not demos."
    key_stories:
      - "How I replaced 4 hours of video editing with one command"
      - "Whisper in production — the lessons nobody talks about"
      - "Building an AI pipeline that handles edge cases (not just the happy path)"

  invoz:
    proof_narrative: "I built an audio ML API. Here's how Whisper works in production."
    consulting_angle: "API design, ML model serving, production reliability — the engineering behind the magic."
    key_stories:
      - "Why Whisper setup is painful and how to fix it"
      - "Speaker diarization in the real world — it's harder than the demos suggest"
      - "Building an ML API that developers actually want to use"

  # TODO: Camilo input needed — which product stories resonate most?
  # Which ones have gotten the best reaction when told in person?

# ─── VOICE ───────────────────────────────────────────────────────────────────
# Derived from analysis of 15 published posts (see knowledge/current/voice-profile.md)

voice:
  archetype: "Builder-philosopher"
  summary: >
    Direct, intellectually honest, first-person narratives that connect
    personal experience to bigger patterns. Confident but not arrogant.
    Shows the work, admits the uncertainty.

  tone:
    - "First person always — 'I built', 'I learned', 'I realized'"
    - "Short paragraphs — 1-3 sentences max"
    - "Arrow bullets (→) for technical lists"
    - "One paradox or inversion per post"
    - "Close with a direct question or forward-looking statement"
    - "Contractions always — don't, won't, that's"
    - "Em-dashes for asides"
    - "Ground claims in evidence — data, names, research"
    - "Confident but honest — builder, not guru"

  hooks:
    contrarian: "Most people are playing with AI. A few are building with it."
    confession: "I used to believe the formula was simple..."
    bold_claim: "The AI OS doesn't replace you. It amplifies the ratio of output-per-hour."
    observation: "We talk a lot about echo chambers. But the one I didn't notice was my own."

  closers:
    question: "What would you build if you had 4x the output capacity?"
    forward: "Still early. Still messy. But that's exactly why it's interesting."
    aphorism: "The co-pilot helps you fly. But you still need a crew."
    one_word: "Building."

  language:
    primary: "en"
    secondary: "es"
    spanish_register: "tu (informal)"
    spanish_note: "Translate concepts, not words. Technical terms stay in English when natural."

# ─── ANTI-PATTERNS ───────────────────────────────────────────────────────────
# Content that should NEVER be generated. Hard rules.

anti_patterns:
  language:
    - "leverage synergies"
    - "drive engagement"
    - "unlock potential"
    - "game-changing"
    - "revolutionary"
    - "transformative (without evidence)"
    - "Let's dive in!"
    - "In today's fast-paced world"
    - "Here's the thing"
    - "Great question!"
    - "Furthermore / Additionally / Moreover"
  style:
    - "Walls of text (>3 sentences per paragraph)"
    - "Passive voice ('this was built' instead of 'I built this')"
    - "Exclamation marks (confidence doesn't shout)"
    - "Heavy emoji usage"
    - "Listicle titles ('5 Ways AI Will Change Your Life')"
    - "Sycophantic openings"
  content:
    - "Financial advice or investment decisions"
    - "Trading content (pythia/milo are isolated systems, never referenced)"
    - "Unsubstantiated claims about AI capabilities"
    - "Attacking competitors by name"
    - "Political content unrelated to AI/tech"
    - "Personal information about clients or prospects"

