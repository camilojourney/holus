    Colombian AI engineer who moved to NYC and built 3 production AI products
    while studying at one of the most competitive universities in the city.
    Not a consultant who reads slides — a builder who ships.
  journey:
    - "Built Pilaster — an AI image generation platform with memory (character registry, backend-agnostic generation, experiment tracking)"
    - "Built genpeli — automated video editing pipeline (silence removal, caption burning, audio normalization)"
    - "Built invoz — Whisper-powered audio ML API (transcription, diarization, silence detection)"
    - "Built holus — AI marketing orchestrator that runs the content engine autonomously"
  turning_point: >
    Realized that building AI products is only half the equation.
    Companies need someone who's done it to guide their transformation.
    The shift from "I build AI tools" to "I help companies build with AI."
