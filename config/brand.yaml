# ─── PLATFORM STRATEGY ───────────────────────────────────────────────────────

platform_strategy:
  primary: "linkedin"
  linkedin_goal: "Thought leader in AI engineering and bilingual tech. B2B, job market, tech community."
  cadence:
    linkedin: "5x/week"
    twitter: "3x/week (repurposed — quick takes, AI commentary)"
    instagram: "2x/week (bilingual side, human story, behind the scenes)"
    threads: "2x/week (conversational, first-person, authenticity)"
    facebook: "1x/week (bilingual ES if applicable)"
  platform_intelligence:
    linkedin:
      content: ["ai_engineering", "building_in_public", "systems_thinking"]
      avoid: "anything that sounds like app promotion without insight"
      format: "text posts (primary), carousels (secondary)"
    twitter:
      content: ["ai_engineering", "building_in_public"]
      avoid: "anything requiring >280 chars of setup"
      format: "threads or single takes"
    instagram:
      content: ["bilingual_ai", "building_in_public (visual)"]
      avoid: "pure technical posts with no human angle"
      format: "reels (from genpeli), carousel, caption"
    threads:
      content: ["bilingual_ai", "building_in_public"]
      avoid: "corporate tone, heavy technical jargon"
      format: "conversational text"
  flow: >
    LinkedIn post (primary, optimized for algorithm, thought leader)
    → Twitter (condensed, more direct, technical audience)
    → Instagram (visual or bilingual, human-side)
    → Threads (conversational version)
    → Facebook (bilingual ES if applicable)

