# Holus — Model Registry
# Source of truth for all model IDs used by Holus agents.
# Updated when Anthropic/Google/OpenAI release new model versions.
# Last updated: 2026-03-13

# --- Proxy Configuration ---
# All LLM calls route through the local proxy (CLIs with OAuth = free).
# Only embeddings use an API key.
proxy:
  base_url: "http://localhost:8080"
  anthropic_base_url: "http://localhost:8080"  # Anthropic SDK format (/v1/messages)
  openai_base_url: "http://localhost:8080/v1"  # OpenAI SDK format (/v1/chat/completions)

# --- Model Tiers ---
# Semantic tiers map to concrete model IDs.
# client.py and config.py read these instead of hardcoding.
tiers:
  strategic:
    model: "claude-opus-4-6"
    fallback: "gemini-3.1-pro-preview"
    description: "Strategy decisions, architecture, complex reasoning"
  operational:
    model: "claude-sonnet-4-6"
    fallback: "gemini-3-flash-preview"
    description: "Content generation, code writing, general tasks"
  classification:
    model: "claude-sonnet-4-6"
    fallback: "gemini-3-flash-preview"
    description: "Routing, classification, quick checks — sonnet is faster than haiku via SDK"

# --- Pricing (per million tokens) ---
# Used by cost tracker in client.py
pricing:
  claude-opus-4-6:
    input: 15.0
    cache_write: 3.75
    cache_read: 1.50
    output: 75.0
  claude-sonnet-4-6:
    input: 3.0
    cache_write: 0.75
    cache_read: 0.30
    output: 15.0
  # claude-haiku-4-5-20251001 removed: not used (slower than sonnet via SDK)
  gpt-5.4:
    input: 3.0
    output: 15.0
  gemini-3-flash-preview:
    input: 0.15
    output: 0.60
  gemini-3.1-pro-preview:
    input: 1.25
    output: 10.0

# --- Available Models ---
# Full list of models accessible through the proxy.
available_models:
  anthropic:
    - claude-opus-4-6
    - claude-sonnet-4-6
  google:
    - gemini-3.1-pro-preview
    - gemini-3-flash-preview
  openai:
    - gpt-5.4
  # Dead models (do not use):
  # claude-haiku-4-5-20251001: slower than sonnet via SDK (~3.6s vs 2.2s)
  # gemini-2.x: replaced by 3.x
  # gpt-4.1, gpt-4.1-mini: empty output via Codex CLI
