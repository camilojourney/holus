# Holus — Model Registry
# Source of truth for all model IDs used by Holus agents.
# Updated when Anthropic/Google/OpenAI release new model versions.
# Last updated: 2026-03-13

# --- Proxy Configuration ---
# All LLM calls route through the local proxy (CLIs with OAuth = free).
# Only embeddings use an API key.
proxy:
  base_url: "http://localhost:8080"
  anthropic_base_url: "http://localhost:8080"  # Anthropic SDK format (/v1/messages)
  openai_base_url: "http://localhost:8080/v1"  # OpenAI SDK format (/v1/chat/completions)

# --- Model Tiers ---
# Semantic tiers map to concrete model IDs.
# client.py and config.py read these instead of hardcoding.
tiers:
  strategic:
    model: "claude-opus-4-6"
    fallback: "gemini-3.1-pro-preview"
    description: "Strategy decisions, architecture, complex reasoning"
  operational:
    model: "claude-sonnet-4-6"
    fallback: "gemini-2.5-flash"
    description: "Content generation, code writing, general tasks"
  classification:
    model: "claude-haiku-4-5-20251001"
    fallback: "gemini-2.0-flash"
    description: "Routing, classification, quick checks"

# --- Pricing (per million tokens) ---
# Used by cost tracker in client.py
pricing:
  claude-opus-4-6:
    input: 15.0
    cache_write: 3.75
    cache_read: 1.50
    output: 75.0
  claude-sonnet-4-6:
    input: 3.0
    cache_write: 0.75
    cache_read: 0.30
    output: 15.0
  claude-haiku-4-5-20251001:
    input: 0.80
    cache_write: 0.08
    cache_read: 0.08
    output: 4.0

# --- Available Models ---
# Full list of models accessible through the proxy.
available_models:
  anthropic:
    - claude-opus-4-6
    - claude-sonnet-4-6
    - claude-haiku-4-5-20251001
  google:
    - gemini-3.1-pro-preview
    - gemini-3-pro-preview
    - gemini-2.5-pro
    - gemini-2.5-flash
    - gemini-2.0-flash
  openai:
    - gpt-5.4
    - gpt-4.1
    - gpt-4.1-mini
