# ─── Lesson: how_i_live — video workout post (2026-03-09) ─────────────────────
- id: lesson-2026-03-09-how-i-live-run
  pillar: how_i_live
  date: 2026-03-09
  input_raw: |
    7.70 mile run, 1:17:02, 9'59" pace. First time back at that distance in a while.
    Winter took the best of me. New York in February hits different. Sun came back, so did I.
    After the run went straight to the gym for abs. New York feels right when it's not winter.
    Hopefully figure out where to spend cold months one day.
  what_worked:
    - Specific distance (7.70 miles) makes it real — not generic "long run"
    - Honest about winter taking a toll — not performative comeback story
    - Layering run + gym session shows how body wanted to keep going
    - "Sun came back and so did I" — simple, resonant
    - Ending on open life question (where to live in winter) fits journey pillar
  what_failed:
    - First draft added Apple Watch framing — Camilo never mentioned the watch brand
    - First draft focused on watch metrics as accountability tool — missed the real story (seasonal comeback)
    - Generic "accountability system" framing — turned a personal story into a framework
  lessons:
    - NEVER add brand names (Apple Watch, Nike, etc.) unless Camilo explicitly names them
    - The watch data is context, not the story — the story is the run, the season, the comeback
    - how_i_live content = describe what happened, not what it means
    - Seasonal + location context (New York winter) adds depth — include it when mentioned
    - Stack activities (run → gym) shows real life rhythm — preserve it
  specialist_update_needed: false  # prompt is correct, execution was wrong
  writer_update_needed: false
