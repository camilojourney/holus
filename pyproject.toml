[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holus"
version = "0.1.0"
description = "Federated AI Operating System for multi-project management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Camilo Martinez" },
]

dependencies = [
    # LLM / Agent orchestration
    "anthropic>=0.40.0",
    "langgraph>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    # Memory
    "mem0ai>=0.1.0",
    # Infrastructure
    "redis>=5.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # HTTP / Config
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "tenacity>=9.0.0",
    # UI / CLI
    "rich>=13.0.0",
    # Observability
    "structlog>=24.4.0",
    "langfuse>=2.50.0",
    # Browser automation (E2E tests)
    "playwright>=1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
holus = "holus.__main__:main"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/holus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "T201",  # print found (allow in dev, CI catches)
]

[tool.ruff.lint.isort]
known-first-party = ["holus"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "mem0ai.*",
    "langgraph.*",
    "langchain_anthropic.*",
    "langfuse.*",
    "redis.*",
]
ignore_missing_imports = true

# Legacy modules — pre-existing complex type issues from initial scaffolding.
# Will be cleaned up as each module is actively rebuilt in the sprint.
[[tool.mypy.overrides]]
module = [
    "holus.memory.mem0_client",
    "holus.core.process_manager",
    "holus.core.kill_switch",
    "holus.core.events",
    "holus.integrations.claude_api.client",
    "holus.observability.langfuse_client",
    "holus.self_improvement.judge",
    "holus.self_improvement.prompt_optimizer",
    "holus.self_improvement.reflexion",
    "holus.agents.base",
    "holus.agents.content.agent",
    "holus.agents.coordinator.agent",
    "holus.agents.coding.agent",
    "holus.agents.pilaster.agent",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require Docker services)",
    "slow: Slow tests (>5s)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]

[tool.coverage.run]
source = ["src/holus"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20250915",
]
