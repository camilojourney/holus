# ==============================================================================
# Holus Infrastructure — Docker Compose
# Provides: PostgreSQL (pgvector), Redis, Langfuse,
#           Prometheus, OTEL Collector, Grafana
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension
  # Shared database server — individual databases created by init-db.sh
  # --------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: holus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: holus
      POSTGRES_PASSWORD: holus
      POSTGRES_DB: holus
    ports:
      - "5432:5432"
    volumes:
      - holus-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - holus-network

  # --------------------------------------------------------------------------
  # Redis 7 — Event bus, kill switch, caching
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: holus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - holus-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - holus-network

  # --------------------------------------------------------------------------
  # Langfuse — LLM observability and tracing
  # --------------------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:latest
    container_name: holus-langfuse
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://holus:holus@postgres:5432/langfuse
      NEXTAUTH_SECRET: holus-langfuse-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3001
      SALT: holus-langfuse-salt-change-in-production
      TELEMETRY_ENABLED: "true"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - holus-network

  # --------------------------------------------------------------------------
  # OTEL Collector — Receives traces/metrics, exports to Prometheus + Langfuse
  # --------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: holus-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
    networks:
      - holus-network

  # --------------------------------------------------------------------------
  # Prometheus — Metrics storage (scrapes OTEL Collector + app metrics)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: holus-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/alerts.yml:/etc/prometheus/alerts.yml:ro
      - holus-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - holus-network

  # --------------------------------------------------------------------------
  # Grafana — Dashboards for metrics + traces
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: holus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: holus
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3002:3000"
    volumes:
      - holus-grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - holus-network

# ==============================================================================
# Volumes — Named volumes for data persistence across restarts
# ==============================================================================
volumes:
  holus-postgres-data:
    driver: local
  holus-redis-data:
    driver: local
  holus-prometheus-data:
    driver: local
  holus-grafana-data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  holus-network:
    driver: bridge
    name: holus-network
